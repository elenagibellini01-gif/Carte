services:
    carte:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        working_dir: /app
        volumes:
            - ./frontend/src:/app/src

    db:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_DB: appdb
            POSTGRES_USER: admin
        ports:
            - "5432:5432"

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        working_dir: /app
        volumes:
            - ./backend/src:/app/src
        depends_on:
            - db